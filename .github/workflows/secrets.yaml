name: Test Secret Masking

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret exists
        env:
          SECRET_X: ${{ secrets.X }}
        run: |
          if [ -z "$SECRET_X" ]; then
            echo "Secret X is empty or unavailable"
            exit 1
          fi

          echo "Secret X is available"
          echo "Secret length: ${#SECRET_X}"

      - name: Test GitHub masking
        env:
          SECRET_X: ${{ secrets.X }}
        run: |
          echo "Direct value: $SECRET_X"
          echo "Embedded value: prefix-$SECRET_X-suffix"
